databases:
  - name: engel-db
    plan: free
    databaseName: engel
    user: engel

services:
  - type: web
    name: engel-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: engel-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://a-kumar14.github.io
      - key: WAITLIST_SUCCESS_URL
        value: https://a-kumar14.github.io/engel/confirmed.html
      - key: RESEND_API_KEY
        sync: false
      - key: WAITLIST_FROM_EMAIL
        sync: false
      - key: PUBLIC_API_BASE_URL
        sync: false
