<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Confirmed — Engel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0c0c0e;color:#ece7dd;font-family:"Inter",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px}
h1{font-family:"Fraunces",serif;font-size:clamp(2rem,5vw,3rem);font-weight:300;letter-spacing:-0.03em;margin-bottom:16px}
p{font-size:15px;color:rgba(236,231,221,0.55);max-width:36ch;line-height:1.7;margin-bottom:8px}
.mono{font-family:"JetBrains Mono",monospace;font-size:13px;color:rgba(236,231,221,0.38);margin-top:24px}
a{color:rgba(236,231,221,0.65);text-decoration:none;border-bottom:1px solid rgba(236,231,221,0.2)}
a:hover{color:#ece7dd}
.error h1{color:#e58a80}
</style>
</head>
<body>
<div id="content">
  <h1>You're on the list.</h1>
  <p>Your email is confirmed. When early access opens for iPhone, you'll hear from us.</p>
  <p class="mono">Notice what's repeating. Change one thing.</p>
  <p class="mono" style="margin-top:32px"><a href="./">← Back to Engel</a></p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const root = document.getElementById('content');
if (params.get('error') === 'invalid') {
  root.innerHTML = '<div class="error"><h1>Link invalid.</h1><p>This confirmation link is not valid. Try signing up again from the home page.</p><p class="mono" style="margin-top:32px"><a href="./">← Back to Engel</a></p></div>';
} else if (params.get('error') === 'expired') {
  root.innerHTML = '<div class="error"><h1>Link expired.</h1><p>Confirmation links last 48 hours. Enter your email again to get a new one.</p><p class="mono" style="margin-top:32px"><a href="./">← Back to Engel</a></p></div>';
}
</script>
</body>
</html>
