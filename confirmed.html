<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Engel — You're on the list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0c0e;color:#ece7dd;font-family:"Inter",system-ui,sans-serif;padding:32px}
    .card{max-width:420px;text-align:center}
    h1{font-family:"Fraunces",serif;font-size:clamp(1.8rem,5vw,2.4rem);font-weight:300;margin-bottom:16px;letter-spacing:-0.02em}
    p{color:rgba(236,231,221,0.55);line-height:1.7;margin-bottom:28px}
    a{color:#4ade80;text-decoration:none;border-bottom:1px solid rgba(74,222,128,0.35)}
    a:hover{color:#86efac}
  </style>
</head>
<body>
  <div class="card">
    <h1>You're confirmed.</h1>
    <p id="message">Your email is on the Engel waitlist. When early access opens for iPhone, you'll hear from us.</p>
    <p><a href="index.html">Back to Engel</a></p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('welcome') === 'pending') {
      document.getElementById('message').textContent =
        "You're in — welcome email is on its way. We'll reach out when early access opens.";
    }
  </script>
</body>
</html>
